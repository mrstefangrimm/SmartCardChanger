<div style="overflow:auto">

  <main class="content">

    <lib-overlaybutton (notify)="onOverlayButtonClick($event)">
    </lib-overlaybutton>

    @if (context.visibilitiesOpen) {
      <div class="menu-items"
      >
        <div>
          <input type="checkbox"
                 [checked]="context.showAsTransparent"
                 (change)="onTransparentChecked()">
          Transparent
        </div>
        <div>
          <input type="checkbox"
                 [checked]="context.showReaderAndCards"
                 (change)="onReaderAndCardsChecked()">
          Cards and Reader
        </div>
        <hr>
        <div>
          <a href="https://www.instructables.com/Smart-Card-Changer/" class="menu-link">
            Meet on instructable
          </a>
        </div>
        <div>
          <a href="https://github.com/mrstefangrimm/SmartCardChanger" class="menu-link">
            Meet on github
          </a>
        </div>
      </div>
    }

    <canvas #rendererCanvas
            id="renderCanvas">
    </canvas>
  </main>

  <div class="navigation">
    <div>
      <p>Longitudinal motion:</p>
      <input type="range"
             min="20"
             max="180"
             value="180"
             class="slider"
             id="Longitudinal"
             #lng
             (input)="onLngChanged(lng)">
    </div>
    <div>
      <p>Rotational motion:</p>
      <input type="range"
             min="10"
             max="170"
             value="90"
             class="slider"
             id="Rotational"
             #rtn
             (input)="onRtnChanged(rtn)">
    </div>
  </div>
</div>
