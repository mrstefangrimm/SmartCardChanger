name: Compile Sketches

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  compile-sketches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
   
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Configure board manager (add Adafruit index)
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index

      - name: Install Adafruit AVR core
        run: |
          arduino-cli core install arduino:avr
          arduino-cli core install adafruit:avr
          # Optional: show installed cores
          arduino-cli core list

      - name: Compile
        run: |
          # Print environment for troubleshooting
          arduino-cli version
          arduino-cli board listall | grep -i feather || true

          # Compile the sketch folder
          arduino-cli compile \
            --fqbn adafruit:avr:feather32u4 \
            --warnings all \
            --export-binaries \
            Software/src/CalibrationApp

