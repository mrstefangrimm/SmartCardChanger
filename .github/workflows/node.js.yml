name: NPM build and test

on:
  push:
    paths:
      - 'Software/src/scc/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: 'Software/src/scc/package-lock.json'

    - working-directory: Software/src/scc
      run: npm ci

    - working-directory: Software/src/scc
      run: npm run build --if-present

    - working-directory: Software/src/scc
      run: npm test threeobject && npm test overlaybutton && npm test

